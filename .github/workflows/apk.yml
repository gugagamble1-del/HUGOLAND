name: Gerar APK Hugoland

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android e ícones
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#1B1530' --iconBackgroundColorDark '#1B1530' --splashBackgroundColor '#1B1530' --splashBackgroundColorDark '#1B1530'
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Hugoland.apk

      - name: Guardar APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Hugoland-apk
          path: Hugoland.apk

      - name: Publicar em Releases (download direto no tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Hugoland ${{ github.run_number }}
          files: Hugoland.apk
